<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Portal - Forgot Password</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<main class="page">

    <section
        class="card"
        aria-labelledby="forgot-password-title"
    >

        <header class="card-header">
            <h1 id="forgot-password-title">
                Reset Password
            </h1>

            <p>
                Enter your email to receive password reset instructions.
            </p>
        </header>

        <div
            id="alert"
            class="alert"
            role="alert"
            aria-live="polite"
        ></div>

        <form
            id="forget-password-form"
            novalidate
        >

            <div class="form-group">
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn"
            >
                Send Reset Link
            </button>

        </form>

        <footer class="form-footer">
            Remember your password?
            <a href="login.html">
                Login
            </a>
            |
            <a href="index.html">
                Register
            </a>
        </footer>

    </section>

</main>

<script src="js/auth.js"></script>

</body>
</html>
